git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "ab1e4419cc16a219d0432bc1c535a8430385d329"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "a99dc4690f411538088463b6db94e38958e65a81"

[[require]]
name = "HexRowReduce"
git = "https://github.com/leanprover/hex-row-reduce.git"
rev = "7550b5334bea67cba65c9a96a87d24557090784f"

[[require]]
name = "HexGFqRing"
git = "https://github.com/leanprover/hex-gfq-ring.git"
rev = "c8e9ae656852744edb51cdf11801248085a7a8d5"

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "a47240943e925951a676d1a1c2f2a615ae68fdef"

[[require]]
name = "HexArith"
git = "https://github.com/leanprover/hex-arith.git"
rev = "ea246536c442464a68210ecce973eb7708968f59"

[[require]]
name = "HexPoly"
