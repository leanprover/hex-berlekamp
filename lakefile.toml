name = "hex-berlekamp"
defaultTargets = ["HexBerlekamp", "HexBerlekampTests"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "1ca7698307ed776c90e1cd796527d432913bd518"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "c3d18a6f58c263a7d56c3eb30e240b423d1ffdd6"

[[require]]
name = "HexRowReduce"
git = "https://github.com/leanprover/hex-row-reduce.git"
rev = "3b2ab9b0dd2c0382dd1f94ca5f0e74363d0a19ca"

[[require]]
name = "HexGFqRing"
git = "https://github.com/leanprover/hex-gfq-ring.git"
rev = "cabf56d523b6a6c52d567470430a48b995aca4fd"

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "0ec35366ca67d3f4d1189cc4c9714805c5c437ec"

[[lean_lib]]
name = "HexBerlekamp"

[[lean_lib]]
name = "HexBerlekampTests"
globs = ["HexBerlekamp.FactorTacticTests"]
